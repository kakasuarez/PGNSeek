services:
  meilisearch:
    image: getmeili/meilisearch:v1
    container_name: pgnseek_meilisearch
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-local-development-master-key}
      - MEILI_HTTP_ADDR=0.0.0.0:7700
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - pgnseek_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: pgnseek_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pgnseek_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: pgnseek_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - pgnseek_net

  # backend:
  #   build:
  #     context: ..
  #     dockerfile: backend/Dockerfile
  #   container_name: pgnseek_backend
  #   env_file:
  #     - ../.env
  #   environment:
  #     - SEARCH_BACKEND=meilisearch
  #     - MEILI_HOST=http://meilisearch:7700
  #     - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-local-development-master-key}
  #     - ES_HOST=http://elasticsearch:9200
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ../backend:/app
  #     - ../pipeline:/pipeline
  #   depends_on:
  #     - meilisearch
  #   networks:
  #     - pgnseek_net
  #   command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: pgnseek_frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - pgnseek_net
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  es_data:
  meili_data:
  frontend_node_modules:

networks:
  pgnseek_net:
    driver: bridge
