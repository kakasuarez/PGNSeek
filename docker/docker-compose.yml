services:
  redis:
    image: redis:7-alpine
    container_name: pgnseek_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pgnseek_net

  backend:
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pgnseek_backend
    env_file:
      - ../.env
    environment:
      - ENV=development
      - ALLOWED_ORIGINS=http://127.0.0.1:5173,http://localhost:5173
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ../pipeline:/pipeline
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pgnseek_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pgnseek_celery
    env_file:
      - ../.env
    environment:
      - ENV=development
      - REDIS_URL=redis://redis:6379/0
      - STOCKFISH_PATH=/usr/local/bin/stockfish
    volumes:
      - ../backend:/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pgnseek_net
    command: celery -A app.tasks.celery_app worker --loglevel=info

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    container_name: pgnseek_frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - pgnseek_net
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  frontend_node_modules:

networks:
  pgnseek_net:
    driver: bridge
